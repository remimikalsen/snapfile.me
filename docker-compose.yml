services:

  snapfile:
    restart: unless-stopped
    container_name: snapfile
    #image: ghcr.io/remimikalsen/snapfile:v1
    build:
      context: .
      dockerfile: Dockerfile.snapfile
    ports:
      - "8080:8080"
    # Container hardening: no privilege escalation, no Linux capabilities, read-only
    # root filesystem (only the two data volumes are writable).
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    environment:
      - TZ=${DOCKER_TZ}
      - MAX_FILE_SIZE=524288000  # 500 MB in bytes = 500 * 1024 * 1024
      - MAX_USES_QUOTA=5
      - FILE_EXPIRY_MINUTES=1440  # 24 hours
      - QUOTA_RENEWAL_MINUTES=60  # 1 hour
      - PURGE_INTERVAL_MINUTES=5
      - CONSISTENCY_CHECK_INTERVAL_MINUTES=1440  # 24 hours
      - INTERNAL_IP=127.0.0.1
      - INTERNAL_PORT=8080
      # Number of reverse proxies that append to X-Forwarded-For (1 = one proxy such as
      # Nginx/Traefik). Set to 0 if clients reach Snapfile directly, otherwise the quota
      # can be bypassed with a forged header.
      - TRUSTED_PROXY_COUNT=1
      - ANALYTICS_SCRIPT=
      - ANALYTICS_SCRIPT_CSP=
      - HTTPS_ONLY=false
    volumes:
      - snapfile-uploads:/app/uploads
      - snapfile-database:/app/database
      # To use host bind mounts instead of Docker volumes, replace the above with:
      # - /snapfile/uploads:/app/uploads
      # - /snapfile/database:/app/database
      # Make sure the host directories exist and are writable by the container user.

volumes:
  snapfile-uploads:
  snapfile-database:
