name: Build, Tag, and Release

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: self-hosted
    steps:
      - name: Check out repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Ensure all refs & tags are fetched

      - name: Determine next version from last tag
        id: semver
        run: |
          # Fetch all tags (sometimes needed explicitly)
          git fetch --tags --prune

          # Get the latest tag, or 0.0.0 if none
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0")
          echo "Latest tag: $LATEST_TAG"

          MAJOR=$(echo "$LATEST_TAG" | cut -d '.' -f 1)
          MINOR=$(echo "$LATEST_TAG" | cut -d '.' -f 2)
          PATCH=$(echo "$LATEST_TAG" | cut -d '.' -f 3)

          NEXT_MAJOR=$MAJOR
          NEXT_MINOR=$MINOR
          NEXT_PATCH=$((PATCH + 1))

          # Check commit message for [major] or [minor]
          if [[ "${{ github.event.head_commit.message }}" =~ \[major\] ]]; then
            NEXT_MAJOR=$((MAJOR + 1))
            NEXT_MINOR=0
            NEXT_PATCH=0
          elif [[ "${{ github.event.head_commit.message }}" =~ \[minor\] ]]; then
            NEXT_MINOR=$((MINOR + 1))
            NEXT_PATCH=0
          fi

          NEXT_VERSION="${NEXT_MAJOR}.${NEXT_MINOR}.${NEXT_PATCH}"
          echo "Computed next version: $NEXT_VERSION"

          # Export variables
          echo "VERSION=$NEXT_VERSION" >> $GITHUB_ENV
          echo "MAJOR=$NEXT_MAJOR" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        run: |
          docker build -t snapfile:build -f Dockerfile.snapfile .

      - name: Tag Docker image
        run: |
          echo "Tagging image with version $VERSION ..."
          docker tag snapfile:build ghcr.io/remimikalsen/snapfile:${{ env.VERSION }}
          docker tag snapfile:build ghcr.io/remimikalsen/snapfile:v${{ env.MAJOR }}

      - name: Login to GitHub Container Registry
        if: always()
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u $GITHUB_ACTOR --password-stdin

      - name: Push Docker image
        run: |
          docker push ghcr.io/remimikalsen/snapfile:${{ env.VERSION }}
          docker push ghcr.io/remimikalsen/snapfile:v${{ env.MAJOR }}

      - name: Push new Git tag
        run: |
          # Configure Git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create and push the new tag
          git tag "${{ env.VERSION }}" -m "ci: release version ${{ env.VERSION }}"
          git push origin "${{ env.VERSION }}"
      
      - name: Retrieve PR info and commits (if any)
        id: get_pr
        uses: actions/github-script@v6
        with:
          script: |
            const { owner, repo } = context.repo;
            let prNumber;
      
            // Try to extract PR number from the commit message (works for merge commits)
            const commitMessage = context.payload.head_commit.message;
            const mergeMatch = commitMessage.match(/Merge pull request #(\d+)/);
            if (mergeMatch) {
              prNumber = parseInt(mergeMatch[1], 10);
              core.info(`Found PR number in merge commit: ${prNumber}`);
            } else {
              // If not found (e.g. for squash merges), query the commit’s associated PRs.
              const commitSHA = context.payload.after;
              const { data: associatedPRs } = await github.request(
                'GET /repos/{owner}/{repo}/commits/{commit_sha}/pulls',
                {
                  owner,
                  repo,
                  commit_sha: commitSHA,
                  headers: {
                    accept: 'application/vnd.github.groot-preview+json'
                  }
                }
              );
              if (associatedPRs.length > 0) {
                prNumber = associatedPRs[0].number;
                core.info(`Found associated PR number: ${prNumber}`);
              }
            }
            
            if (!prNumber) {
              core.info("No associated PR found for this commit");
              return { title: "", body: "", commit_messages: "" };
            }
            
            // Get PR details
            const prRes = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber
            });
            const pr = prRes.data;
            
            // Get PR commits
            const commitsRes = await github.rest.pulls.listCommits({
              owner,
              repo,
              pull_number: prNumber
            });
            const commitMessages = commitsRes.data.map(commit => commit.commit.message).join('\n');
      
            return {
              title: pr.title,
              body: pr.body || "",
              commit_messages: commitMessages
            };

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.VERSION }}
          name: "Release ${{ env.VERSION }}"
          body: |
            ## Docker Image
            - **Version:** `${{ env.VERSION }}`
            - **Image:** `ghcr.io/remimikalsen/snapfile:${{ env.VERSION }}`
      
            **PR Title:** ${{ steps.get_pr.outputs.title }}
            **PR Description:**
            ${{ steps.get_pr.outputs.body }}
      
            **Commit Messages:**
            ${{ steps.get_pr.outputs.commit_messages }}
          draft: false
          prerelease: false      

      - name: Trigger production update
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            -H "Secret: ${{ secrets.WEBHOOK_SECRET }}" \
            -d '{"version": "'${{ env.VERSION }}'"}' \
            https://webhooks.theawesomegarage.com/update-snapfile
