name: Code checks and testing

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write   # allows pushing badge

jobs:
  check_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -r tests/requirements-tests.txt

      - name: Run pip-audit before tests
        run: |
          echo "Running pip-audit to check for vulnerabilities..."
          pip-audit --requirement requirements.txt --format json --output pip-audit-results.json || \
            (echo "::error::pip-audit found vulnerabilities in Python dependencies." && \
             echo "Please review and fix vulnerabilities before proceeding." && \
             pip-audit --requirement requirements.txt --format table && exit 1)
          echo "pip-audit passed - no vulnerabilities found in Python dependencies."

      - name: Run linter
        run: |
          echo "Running flake8 linter..."
          pip install flake8 flake8-pyproject
          flake8 app/ --max-line-length=88 --extend-ignore=E501 || \
            (echo "::error::Linting failed. Please fix the issues." && exit 1)
          echo "Linting passed."

      - name: Install Playwright browsers
        run: |
          playwright install --with-deps

      - name: Run unit tests and capture test coverage output
        id: run_tests
        run: |
          pytest tests/unit/ -v --cov=app --cov-report=xml --cov-report=term

      - name: Start application for E2E tests
        run: |
          # Set environment variables for test directories
          export UPLOAD_DIR=$(pwd)/test_uploads
          export DATABASE_DIR=$(pwd)/test_database
          # Start the app in the background
          cd app
          python app.py > ../app.log 2>&1 &
          APP_PID=$!
          echo "APP_PID=$APP_PID" >> $GITHUB_ENV
          echo "Waiting for app to start (PID: $APP_PID)..."
          # Wait for app to be ready (max 30 seconds)
          for i in {1..30}; do
            if curl -f http://localhost:8080/ > /dev/null 2>&1; then
              echo "App started successfully!"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "App failed to start. Logs:"
              cat ../app.log
              exit 1
            fi
            sleep 1
          done
        env:
          BASE_URL: http://localhost:8080

      - name: Run E2E tests
        run: |
          export BASE_URL=http://localhost:8080
          pytest tests/e2e/ -v -m e2e

      - name: Stop application
        if: always()
        run: |
          if [ ! -z "$APP_PID" ]; then
            echo "Stopping app (PID: $APP_PID)"
            kill $APP_PID 2>/dev/null || true
            sleep 2
            # Force kill if still running
            kill -9 $APP_PID 2>/dev/null || true
          fi
          # Show app logs for debugging
          if [ -f app.log ]; then
            echo "=== App logs ==="
            cat app.log
          fi

      - name: Upload coverage reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report-${{ github.event.pull_request.number }}
          path: |
            tests/coverage.xml
          retention-days: 30
